name: Publish to GitHub Pages

# Publishes the site by pushing the repo contents to the gh-pages branch,
# which GitHub Pages serves. (API-based Pages enablement isn't available
# to the workflow token, so the classic branch-based flow is used.)

on:
  push:
    branches:
      - main
      - claude/jacquimelman-rebuild-cagxkp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push -f origin gh-pages
